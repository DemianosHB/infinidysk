name: Rust Docker build and push

# Builds the Rust image from rust/Dockerfile (build context: rust/) and pushes it to
# this fork's own GHCR namespace as a separate package, so it never mixes with the
# v1 (C#) images in ghcr.io/demianoshb/infinidysk:
#   ghcr.io/demianoshb/infinidysk-rust
# Triggers:
#   - push to rust                -> rolling "rust-dev" image (plus "latest")
#   - push of a tag starting "v2*" -> versioned image named after the tag
#   - manual dispatch              -> optional tag/ref inputs
# GITHUB_TOKEN with packages:write is enough for GHCR.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. v2.0.0-beta.12-Demianos1); empty = rust-dev"
        required: false
        default: ""
      ref:
        description: "Branch / tag / SHA to build (empty = triggering ref)"
        required: false
        default: ""
  push:
    branches:
      - rust
    tags:
      - "v2*"
    paths:
      - "rust/**"
      - ".github/workflows/rust-docker-build-push.yml"

permissions:
  contents: read

concurrency:
  group: rust-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push (amd64 + arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve image name, tag and version
        id: vars
        env:
          INPUT_TAG: ${{ inputs.tag || github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "branch" ] && [ -z "${{ inputs.tag }}" ]; then
            # Rolling tag: branch pushes always build the current fork state.
            tag="rust-dev"
          else
            # Tag pushes and manual dispatches use the tag name as given.
            tag="$INPUT_TAG"
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-rust" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=$(echo "$tag" | sed 's|^v||')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: rust
          file: rust/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:latest
          build-args: |
            COMMIT=${{ github.sha }}
            VERSION=${{ steps.vars.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
