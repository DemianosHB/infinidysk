name: Rust Docker build and push

# Builds the Rust image from rust/Dockerfile (build context: rust/) and pushes it to
# this fork's own GHCR namespace as a separate package, so it never mixes with the
# v1 (C#) images in ghcr.io/demianoshb/neodysk:
#   ghcr.io/demianoshb/neodysk-rust
# Each architecture builds natively on its own runner (amd64 on x86, arm64 on an ARM
# runner) — no QEMU emulation, which made the combined multi-arch build take over an
# hour. Each leg pushes its image by digest; a final job assembles the multi-arch
# manifest for the tag (and "latest").
# Triggers (tag-only: branch pushes to rust do not build, to save runner time):
#   - push of a tag starting "v2*" -> versioned image named after the tag (plus "latest")
#   - manual dispatch              -> optional tag/ref inputs (empty tag on a branch = "rust-dev")
# GITHUB_TOKEN with packages:write is enough for GHCR.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. v2-beta.03, see rust/README.md#release-versioning); empty = rust-dev"
        required: false
        default: ""
      ref:
        description: "Branch / tag / SHA to build (empty = triggering ref)"
        required: false
        default: ""
  push:
    tags:
      - "v2*"

permissions:
  contents: read

concurrency:
  group: rust-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          # Tag refs, so the stamp step can list every v2* tag.
          fetch-tags: true

      - name: Resolve image name, tag and version
        id: vars
        env:
          INPUT_TAG: ${{ inputs.tag || github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "branch" ] && [ -z "${{ inputs.tag }}" ]; then
            # Rolling tag: only reachable via manual dispatch on a branch without a tag input.
            tag="rust-dev"
          else
            # Tag pushes and manual dispatches use the tag name as given.
            tag="$INPUT_TAG"
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-rust" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=$(echo "$tag" | sed 's|^v||')" >> "$GITHUB_OUTPUT"

      # Writes the release notes of every v2* tag (each tag's PRs merged into rust since the
      # previous v2* tag, newest tag first) into the build context, so each build serves the
      # full fork release history; build.rs embeds them ahead of the upstream changelog.
      - name: Stamp the v2* release notes into the build
        if: steps.vars.outputs.tag != 'rust-dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr list --repo "$REPO" --state merged --base rust --limit 1000 \
            --json number,title,url,mergedAt \
            | bash .github/scripts/stamp-release-notes.sh --repo "$REPO" --out rust/release-notes.build.md
          cat rust/release-notes.build.md

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: rust
          file: rust/Dockerfile
          push: true
          push-by-digest: true
          name-canonical: true
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
          build-args: |
            COMMIT=${{ github.sha }}
            VERSION=${{ steps.vars.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # Fixed scope per platform, so repeated builds reuse the warmed cache.
          cache-from: type=gha,scope=rust-docker-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=rust-docker-${{ matrix.platform }}

      - name: Record digest
        run: echo "${{ steps.build.outputs.digest }}" > "digest-${{ strategy.job-index }}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ strategy.job-index }}
          path: digest-${{ strategy.job-index }}
          retention-days: 1

  manifest:
    name: Assemble multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve image name, tag and version
        id: vars
        env:
          INPUT_TAG: ${{ inputs.tag || github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "branch" ] && [ -z "${{ inputs.tag }}" ]; then
            tag="rust-dev"
          else
            tag="$INPUT_TAG"
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-rust" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=$(echo "$tag" | sed 's|^v||')" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch tags
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          TAG: ${{ steps.vars.outputs.tag }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t refs < <(sed "s|^|$IMAGE@|" digest-*)
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "index:org.opencontainers.image.version=${VERSION}" \
            -t "$IMAGE:$TAG" -t "$IMAGE:latest" "${refs[@]}"
