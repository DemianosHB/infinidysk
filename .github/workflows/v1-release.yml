name: v1 Release

# Fork note (DemianosHB): upstream's release-please pipeline is intentionally
# disabled in this fork.
# - The release-please job fails on every v1 push in the fork ("Create release").
# - The deploy jobs publish to docker.io/infinidysk (no DOCKERHUB_TOKEN here) and
#   duplicate the fork's own fork-docker-build-push.yml.
# Fork releases are driven by tags instead: pushing tag vX.Y.Z-langN fires
# fork-docker-build-push.yml, which builds the versioned image; release notes
# are written via the GitHub UI.

on:
  workflow_dispatch: {}

jobs:
  disabled:
    name: Disabled in fork
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "upstream release pipeline intentionally disabled in this fork"
