name: Fork test debug

# TEMPORARY fork-only helper (DemianosHB/infinidysk): diagnose the flaky
# "Backend tests" CI failures on v1. Runs the EXACT CI test command and
# surfaces the exit code, failed test names and hang markers as build
# annotations via plain shell (no python), because raw fork CI logs are
# not readable without admin auth. Delete once the cause is identified.

on:
  push:
    branches:
      - v1
  workflow_dispatch: {}

concurrency:
  group: fork-test-debug
  cancel-in-progress: true

jobs:
  backend-test-report:
    name: Backend test report
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
          submodules: true
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Verify native build tools
        run: cmake --version && ninja --version
      - name: Build rapidyenc (linux-x64)
        run: scripts/build-rapidyenc.sh linux-x64
      - name: Restore .NET solution
        run: dotnet restore NzbWebDAV.sln
      - name: Build backend test project
        run: >
          dotnet build tests/NzbWebDAV.Tests/NzbWebDAV.Tests.csproj -c Release --no-restore
          -p:RunAnalyzers=false
          -p:EnforceCodeStyleInBuild=false
          -p:SkipRapidYencNativeEnsure=true
      - name: Test backend (exact CI command) and annotate
        timeout-minutes: 15
        env:
          RAPIDYENC_LIBRARY_PATH: ${{ github.workspace }}/libs/RapidYencSharp/runtimes/linux-x64/native/librapidyenc.so
        run: |
          set +e
          start=$(date +%s)
          dotnet test tests/NzbWebDAV.Tests/NzbWebDAV.Tests.csproj -c Release --no-build --no-restore \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --blame-hang-timeout 2m \
            --blame-hang-dump-type none \
            > cov-test.log 2>&1
          code=$?
          dur=$(( $(date +%s) - start ))
          echo "::notice ::dotnet test exit code: $code (duration ${dur}s)"
          if [ "$code" != "0" ]; then
            echo "::error ::dotnet test FAILED with exit code $code after ${dur}s"
          fi
          # Failed test names appear as lines like "  Failed TestName [12 ms]"
          fails=$(grep -cE '^[[:space:]]+Failed[[:space:]]' cov-test.log)
          if [ "$fails" -gt 0 ]; then
            grep -E '^[[:space:]]+Failed[[:space:]]' cov-test.log | while read -r line; do
              echo "::error ::FAILED TEST: ${line//[[:space:]]+/ }"
            done
          else
            echo "::notice ::No 'Failed <test>' lines found in console output"
          fi
          # Summary lines: "Passed! - Failed: 0 ..." etc.
          grep -E '(Passed!|Failed!|Total tests|Passed:|Failed:)' cov-test.log | tail -6 | while read -r line; do
            echo "::notice ::SUMMARY: ${line//[[:space:]]+/ }"
          done
          # Crash / hang markers
          grep -iE '(Hang Detector|timed out|Testhost process exited with error|StackOverflow|OutOfMemory|Killed|SessionId)' cov-test.log | head -8 | while read -r line; do
            echo "::error ::CRASH MARKER: ${line//[[:space:]]+/ }"
          done
          exit 0
